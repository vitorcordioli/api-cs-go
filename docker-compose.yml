version: "3.8"

services:
  postgres:
    container_name: postgres_csapi
    image: bitnami/postgresql:latest
    environment:
      POSTGRES_USER: vitor
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: csapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/src/lib/postgresql/data

volumes:
  postgres_data:
